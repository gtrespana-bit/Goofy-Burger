<body>
<script>
  // Si la interfaz falla (sintaxis, localStorage, etc.), lo mostramos en
  // pantalla en vez de dejar la ventana en blanco: facilita diagnosticar
  // un .exe con una versión vieja de la web.
  function showJsError(msg) {
    try {
      var el = document.getElementById('js-error');
      if (!el) {
        el = document.createElement('div');
        el.id = 'js-error';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff6b6b;color:#fff;padding:10px 14px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.4)';
        (document.body || document.documentElement).appendChild(el);
      }
      el.textContent = '⚠ Error de interfaz: ' + String(msg || '').slice(0, 500) + ' · recarga con Ctrl+Shift+R';
    } catch (e) { /* no podemos hacer más */ }
  }
  window.addEventListener('error', function (ev) {
    try {
      var msg = ev.error && ev.error.message ? ev.error.message : ev.message;
      showJsError(msg);
    } catch (e) { /* no podemos hacer más */ }
  });
  window.addEventListener('unhandledrejection', function (ev) {
    try {
      var r = ev.reason;
      var msg = (r && (r.message || r.stack || String(r))) || 'promesa rechazada';
      showJsError(msg);
    } catch (e) { /* no podemos hacer más */ }
  });
</script>

<script src="/app.js?v=20260831"></script>
<script>
  // PWA: la app vieja con service-worker anterior podía dejar en caché un
  // app.js que fallaba (tabs/añadir/borrar cámaras). Aquí forzamos una única
  // recarga cuando entra el nuevo SW y vaciamos las cachés antiguas.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const setFlag = (k) => { try { sessionStorage.setItem(k, '1'); } catch (e) {} };
      const hasFlag = (k) => { try { return sessionStorage.getItem(k) === '1'; } catch (e) { return false; } };
      (async () => {
        try {
          // Borra cachés de PWAs anteriores (vigia-pro-v3/v4, etc.), pero
          // respeta la caché actual v5 para no dejar la app sin offline.
          if (window.caches && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys
              .filter(k => /^vigia-pro-v[1-4]$/.test(k))
              .map(k => caches.delete(k)));
          }
          const reg = await navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' });
          if (reg.waiting && !hasFlag('vigia-sw-skip')) {
            setFlag('vigia-sw-skip');
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          if (navigator.serviceWorker.controller) {
            setFlag('vigia-sw-skip');
            reg.update().catch(() => {});
          }
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hasFlag('vigia-sw-refresh')) {
              setFlag('vigia-sw-refresh');
              location.reload();
            }
          });
        } catch (e) { /* sin servicios de PWA, no es bloqueante */ }
      })();
    });
  }
</script>
